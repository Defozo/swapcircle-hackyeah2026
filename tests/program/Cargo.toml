[package]
name = "swapcircle-program-tests"
version = "1.0.0"
edition = "2021"
publish = false

# Separate workspace isolates the VM host's validator dependencies from SBF.
[workspace]

[dependencies]
litesvm = "=0.9.1"
solana-address = { version = "2.0", features = ["curve25519", "sha2"] }
solana-account = "3.3"
solana-clock = "~3.0"
solana-instruction = "~3.1"
solana-keypair = "~3.1"
solana-message = "~3.0"
solana-signer = "3.0"
solana-transaction = { version = "~3.0", features = ["bincode"] }
sha2 = "0.10"
bincode = "1.3"
serde_json = "1.0"
