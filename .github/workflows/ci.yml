name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web-and-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  program:
    runs-on: ubuntu-latest
    container:
      image: quay.io/ottersec/anchor@sha256:4ef4cf067fb1332ddd2b997a48ed05257854f51067ade342d63ebdc1039fe72e
    steps:
      - uses: actions/checkout@v4
      - run: anchor build --no-idl --ignore-keys
      - run: cargo test --locked --manifest-path tests/program/Cargo.toml -- --nocapture
